# Legwan Admin — electron-builder configuration (ÉDITEUR uniquement)
# Variante interne incluant la console super-admin.
# NE PAS DISTRIBUER aux commerçants — usage éditeur uniquement.
#
# Commande : npm run dist:admin
# Produit  : release/Legwan-Admin-Setup-x.y.z.exe

appId: cm.legwan.manager.admin
productName: Legwan Admin
copyright: "© 2026 Legwan. Tous droits réservés."

forceCodeSigning: false
afterPack: scripts/after-pack-rcedit.cjs
asar: true
asarUnpack:
  - electron/**/*

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

  # See electron-builder.yml: no "!node_modules/**/*" here. That exclusion kept
  # electron-updater out of the package and silently killed auto-update.
  # package.json now declares only electron-updater as a runtime dependency, so
  # electron-builder collects the right closure on its own.
  - "!src/**/*"
  - "!tests/**/*"
  - "!*.test.*"
  - "!scripts/**/*"
  - "!**/*.pem"
  - "!**/*.key"
  - "!service-account*.json"
  - "!.env"
  - "!.env.*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  perMachine: false
  # GUID distinct du client — les deux variantes coexistent sur la même machine
  # sans que Windows les confonde (mises à jour, désinstallation indépendantes).
  guid: "d4e5f6a7-8b9c-0d1e-2f3a-4b5c6d7e8f9a"
  include: build/installer.admin.nsh

  installerLanguages:
    - fr-FR
  language: "1036"

  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Legwan Admin

  license: build/LICENSE.rtf
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  runAfterFinish: true

# L'éditeur met à jour sa version admin en la reconstruisant manuellement.
#
# publish: null est indispensable, pas seulement l'absence d'un bloc publish :
# sans lui, electron-builder déduit un canal depuis le dépôt Git et écrit un
# app-update.yml pointant sur Breniell/shopnova-manager, où seules les releases
# CLIENT sont publiées. La variante admin proposerait alors de "se mettre à
# jour" en téléchargeant l'installeur client, qui s'installe à côté (appId et
# GUID distincts) au lieu de la remplacer : on se retrouve avec le client
# installé et l'admin figé, en croyant l'avoir mis à jour.
#
# Sans canal, checkForUpdates() échoue et part dans le gestionnaire d'erreur de
# main.mjs (console.warn dans le journal de diagnostic). C'est voulu.
publish: null
